[project]
name = "tr3-month"
version = "10.0.0"
description = "Telegram bot with moderation, governance, Radio postings and operational safety"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.27.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "SQLAlchemy==2.0.41",
    "uvicorn==0.35.0",
    "Pillow==11.3.0",
    "playwright==1.56.0",
    "cryptography==46.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = "."

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
